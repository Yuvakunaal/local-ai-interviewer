<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo-512.png" />
    <meta name="theme-color" content="#5648f0" />
    <title>AI Interviewer</title>
    <!-- apply the saved colour theme before the first paint (no flash). Default is light. -->
    <script>
      try {
        var p = localStorage.getItem("lai.theme");
        document.documentElement.dataset.theme = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
