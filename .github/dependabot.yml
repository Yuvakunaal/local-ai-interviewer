# Weekly dependency update pull requests, grouped so maintainers get a few reviewable PRs instead of a flood.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly, day: monday}
    # Change a range in requirements*.txt only when a new version falls outside it. The hash-locked requirements*.lock files
    # choose the installed versions (regenerate them as their header says); raising a minimum here would also drop Python 3.10
    # whenever a package's newest release needs 3.11 (python-multipart 0.0.34 did).
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      npm-dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      npm-runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
